[project]
name = "pixeldash"
version = "0.1.0"
description = "A small LED matrix dashboard with a desktop emulator"
authors = [{name = "Bart Galvin", email = "bartgalvin@gmail.com"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "pillow>=10.0",
    "pygame>=2.5",
]

[project.optional-dependencies]
services = [
    "spotipy>=2.23",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.scripts]
pixeldash = "pixeldash.cli:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["pixeldash*"]

[tool.setuptools.package-data]
pixeldash = [
    "assets/fonts/*.otf",
    "assets/color_schemes/*.json",
    "assets/images/weather/*.png",
]
