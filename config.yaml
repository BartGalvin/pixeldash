# Pixeldash settings. Put your own overrides in config.local.yaml.

display:
  width: 64
  height: 32

emulator:
  pixel_size: 10

dashboard:
  screens: [clock, hello]
  interval: 10

color_scheme: Kanagawa

matrix:
  rows: 32
  cols: 64
  brightness: 80
  chain_length: 1
  parallel: 1
  hardware_mapping: adafruit-hat
  gpio_slowdown: 1
  pwm_lsb_nanoseconds: 80
  limit_refresh_rate_hz: 150

font:
  name: tiny.otf
  size: 5

clock:
  show_date: true
  format_24h: true

weather:
  city: ""  # For example, "Boston,MA,US"
  units: imperial  # metric for Celsius, imperial for Fahrenheit
  api_key: null

spotify:
  client_id: null
  client_secret: null
  redirect_uri: http://127.0.0.1:8888/callback
  cache_path: .spotify_cache
