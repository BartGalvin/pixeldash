name: Checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    env:
      SDL_VIDEODRIVER: dummy
      PYGAME_HIDE_SUPPORT_PROMPT: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install base package
        run: python -m pip install .
      - name: Check offline screens and emulator
        run: python -m unittest discover -s tests -v
      - name: Install service support
        run: python -m pip install '.[services]'
      - name: Check services with mocked responses
        run: python -m unittest discover -s tests -v
      - name: Check installed assets outside the checkout
        run: |
          cd "$RUNNER_TEMP"
          python - <<'PY'
          from pathlib import Path
          from pixeldash.config import get_config, IMAGE_DIR
          from pixeldash.screens import ClockScreen
          from pixeldash.color_scheme import list_available_schemes
          assert Path(get_config().get("font.path")).is_file()
          assert "Kanagawa" in list_available_schemes()
          assert (IMAGE_DIR / "weather" / "01d.png").is_file()
          assert ClockScreen().render().size == (64, 32)
          PY
